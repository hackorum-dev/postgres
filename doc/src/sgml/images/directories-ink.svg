     id="style4">
  .text_normal  {font-style:normal;
                 font-weight:normal;
                 font-size:16px;
                 font-family:&quot;Open Sans&quot;, sans-serif;
                 fill:black;
                }
  .text_big     {font-style:normal;
                 font-weight:normal;
                 font-size:24px;
                 font-family:&quot;Open Sans&quot;, sans-serif;
                 fill:black;
                }
  </style>
  <defs
     id="defs26">
    <!--  Directory  -->
    <symbol
       id="directory"
       stroke="blue"
       stroke-width="0.3px"
       fill="aqua">
      <title
         id="title6">Directory</title>
      <rect
         x="0"
         y="10"
         width="110"
         height="20"
         id="rect8" />
      <path
         d="M 0,10 l 0,-2 3,-3 35,0, 3,3  0,2"
         id="path10" />
    </symbol>
    <!--  File  -->
    <symbol
       id="file"
       stroke="black"
       fill="none">
      <title
         id="title13">File</title>
      <rect
         x="0"
         y="0"
         width="40"
         height="50"
         stroke="blue"
         id="rect15" />
      <path
         d="M 5,10 h 20"
         stroke-dasharray="4 2"
         id="path17" />
      <path
         d="M 5,17 h 15"
         stroke-dasharray="6 2"
         id="path19" />
      <path
         d="M 5,24 h 25"
         stroke-dasharray="4 2"
         id="path21" />
      <path
         d="M 5,31 h 20"
         stroke-dasharray="5 2"
         id="path23" />
    </symbol>
  </defs>
  <!--  start of rendering area  -->
  <!--  enclosing rectangle  -->
  <rect
     x="1"
     y="1"
     rx="5"
     width="99%"
     height="99%"
     stroke="black"
     fill="none"
     id="rect28" />
  <!--  caption  -->
  <text
     x="50"
     y="50"
     class="text_big"
     id="text30">Directory structure for storing durable and fluctuating information</text>
  <!--  the directories  -->
  <g
     transform="translate(20, 100)"
     id="g38">
    <use
       xlink:href="#directory"
       id="use32" />
    <text
       x="10"
       y="26"
       class="text_normal"
       id="text34">... /pg/</text>
    <text
       x="300"
       y="26"
       class="text_normal"
       id="text36">An arbitrary directory</text>
  </g>
  <g
     transform="translate(70, 130)"
     id="g46">
    <use
       xlink:href="#directory"
       id="use40" />
    <text
       x="10"
       y="26"
       class="text_normal"
       id="text42">data/</text>
    <text
       x="250"
       y="26"
       class="text_normal"
       id="text44">Root of cluster 'data' (see: PGDATA)</text>
  </g>
  <g
     transform="translate(120, 160)"
     id="g54">
    <use
       xlink:href="#directory"
       id="use48" />
    <text
       x="10"
       y="26"
       class="text_normal"
       id="text50">base/</text>
    <text
       x="200"
       y="26"
       class="text_normal"
       id="text52">Subdirectory containing per-database subdirectories</text>
  </g>
  <!--  -->
  <g
     transform="translate(170, 190)"
     id="g62">
    <use
       xlink:href="#directory"
       id="use56" />
    <text
       x="10"
       y="26"
       class="text_normal"
       id="text58">1/</text>
    <text
       x="150"
       y="26"
       class="text_normal"
       id="text60">Subdirectory for data of first database 'template0'</text>
  </g>
  <g
     transform="translate(170, 220)"
     id="g70">
    <use
       xlink:href="#directory"
       id="use64" />
    <text
       x="10"
       y="26"
       class="text_normal"
       id="text66">12992/</text>
    <text
       x="150"
       y="26"
       class="text_normal"
       id="text68">Subdirectory for data of second database 'template1'</text>
  </g>
  <g
     transform="translate(170, 250)"
     id="g78">
    <use
       xlink:href="#directory"
       id="use72" />
    <text
       x="10"
       y="26"
       class="text_normal"
       id="text74">12999/</text>
    <text
       x="150"
       y="26"
       class="text_normal"
       id="text76">Subdirectory for data of third database 'postgres'</text>
  </g>
  <g
     transform="translate(170, 280)"
     id="g86">
    <use
       xlink:href="#directory"
       id="use80" />
    <text
       x="10"
       y="26"
       class="text_normal"
       id="text82">nnnnn/</text>
    <text
       x="150"
       y="26"
       class="text_normal"
       id="text84">Optional: more subdirectories for databases, e.g. 'my_db'</text>
  </g>
  <g
     transform="translate(120, 310)"
     id="g94">
    <use
       xlink:href="#directory"
       id="use88" />
    <text
       x="10"
       y="26"
       class="text_normal"
       id="text90">global/</text>
    <text
       x="200"
       y="26"
       class="text_normal"
       id="text92">Subdirectory with information about Global SQL Objects</text>
  </g>
  <g
     transform="translate(120, 340)"
     id="g102">
    <use
       xlink:href="#directory"
       id="use96" />
    <text
       x="10"
       y="26"
       class="text_normal"
       id="text98">pg_wal/</text>
    <text
       x="200"
       y="26"
       class="text_normal"
       id="text100">Subdirectory for Write Ahead Log files ('pg_xlog' before version 10)</text>
  </g>
  <g
     transform="translate(120, 370)"
     id="g110">
    <use
       xlink:href="#directory"
       id="use104" />
    <text
       x="10"
       y="26"
       class="text_normal"
       id="text106">pg_xact/</text>
    <text
       x="200"
       y="26"
       class="text_normal"
       id="text108">Subdirectory for transaction commit status ('pg_clog' before version 10)</text>
  </g>
  <g
     transform="translate(120, 400)"
     id="g118">
    <use
       xlink:href="#directory"
       id="use112" />
    <text
       x="10"
       y="26"
       class="text_normal"
       id="text114">pg_tblspc/</text>
    <text
       x="200"
       y="26"
       class="text_normal"
       id="text116">Subdirectory containing symbolic links to tablespaces</text>
  </g>
  <g
     transform="translate(120, 430)"
     id="g126">
    <use
       xlink:href="#directory"
       id="use120" />
    <text
       x="10"
       y="26"
       class="text_normal"
       id="text122">pg_... /</text>
    <text
       x="200"
       y="26"
       class="text_normal"
       id="text124">Some more subdirectories</text>
  </g>
  <g
     transform="translate(120, 465)"
     id="g134">
    <use
       xlink:href="#file"
       x="0"
       y="0"
       id="use128" />
    <use
       xlink:href="#file"
       x="50"
       y="0"
       id="use130" />
    <text
       x="200"
       y="26"
       class="text_normal"
       id="text132">'postmaster.pid' and other files with cluster-wide relevance</text>
  </g>
  <!--  next cluster  -->
  <g
     transform="translate(20, 540)"
     id="g142">
    <use
       xlink:href="#directory"
       id="use136" />
    <text
       x="10"
       y="26"
       class="text_normal"
       id="text138">... /xyz/</text>
    <text
       x="300"
       y="26"
       class="text_normal"
       id="text140">Same or another arbitrary directory</text>
  </g>
  <g
     transform="translate(70, 570)"
     id="g150">
    <use
       xlink:href="#directory"
       id="use144" />
    <text
       x="10"
       y="26"
       class="text_normal"
       id="text146">cluster_2/</text>
    <text
       x="250"
       y="26"
       class="text_normal"
       id="text148">Root of another cluster 'cluster_2'</text>
  </g>
